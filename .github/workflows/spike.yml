name: Feasibility spike

# Phase A's spike already passed (see PLAN.md) — this now runs on demand only, so it doesn't
# spend ~15 minutes of CI time re-proving something already proven on every push to Phase B.
# Re-run manually (Actions tab > Feasibility spike > Run workflow) if the spike infrastructure
# itself changes and needs re-verifying.
on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Pull stellar-core images
        run: |
          docker pull stellar/stellar-core:28
          docker pull stellar/stellar-core:29

      - name: Run feasibility spike
        run: |
          chmod +x spike/run-spike.sh spike/generate-configs.sh
          spike/run-spike.sh

      - name: Write SPIKE.md to job summary
        if: always()
        run: cat spike/SPIKE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spike results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spike-results
          path: |
            spike/SPIKE.md
            spike/fixtures/
          retention-days: 30
