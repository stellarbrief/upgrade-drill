# Feasibility spike topology: 3 stellar-core validators on a private Docker network.
# Image tags are per-node env vars (default 29) so the run script can restart node3 on an
# older image without touching this file — see PLAN.md "Phase A" and run-spike.sh.
name: upgrade-drill-spike

services:
  # Named volumes are created root-owned and empty by Docker. If the stellar-core image runs
  # as a non-root user by default, `new-db`/bucket writes into a fresh /data volume can fail
  # silently from the host's point of view (the container never gets far enough to open its
  # HTTP port at all) — see PLAN.md "Spike attempt #2 result" for why this was added.
  init-node1:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/buckets && chmod -R 777 /data"]
    volumes:
      - node1-data:/data
  init-node2:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/buckets && chmod -R 777 /data"]
    volumes:
      - node2-data:/data
  init-node3:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /data/buckets && chmod -R 777 /data"]
    volumes:
      - node3-data:/data

  node1:
    image: stellar/stellar-core:${NODE1_TAG:-29}
    hostname: node1
    depends_on:
      init-node1:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-xc"]
    command:
      - "stdbuf -oL -eL stellar-core new-db --conf /config/stellar-core.cfg; c=$$?; echo \"NEWDB_EXIT_CODE=$$c\"; [ $$c -eq 0 ] || exit $$c; exec stdbuf -oL -eL stellar-core run --conf /config/stellar-core.cfg"
    volumes:
      - ./generated/node1.cfg:/config/stellar-core.cfg:ro
      - node1-data:/data
    ports:
      - "11626:11626"
    networks:
      - drill

  node2:
    image: stellar/stellar-core:${NODE2_TAG:-29}
    hostname: node2
    depends_on:
      init-node2:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-xc"]
    command:
      - "stdbuf -oL -eL stellar-core new-db --conf /config/stellar-core.cfg; c=$$?; echo \"NEWDB_EXIT_CODE=$$c\"; [ $$c -eq 0 ] || exit $$c; exec stdbuf -oL -eL stellar-core run --conf /config/stellar-core.cfg"
    volumes:
      - ./generated/node2.cfg:/config/stellar-core.cfg:ro
      - node2-data:/data
    ports:
      - "11627:11626"
    networks:
      - drill

  node3:
    image: stellar/stellar-core:${NODE3_TAG:-29}
    hostname: node3
    depends_on:
      init-node3:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-xc"]
    command:
      - "stdbuf -oL -eL stellar-core new-db --conf /config/stellar-core.cfg; c=$$?; echo \"NEWDB_EXIT_CODE=$$c\"; [ $$c -eq 0 ] || exit $$c; exec stdbuf -oL -eL stellar-core run --conf /config/stellar-core.cfg"
    volumes:
      - ./generated/node3.cfg:/config/stellar-core.cfg:ro
      - node3-data:/data
    ports:
      - "11628:11626"
    networks:
      - drill

networks:
  drill:
    name: upgrade-drill-spike-net

volumes:
  node1-data:
  node2-data:
  node3-data:
