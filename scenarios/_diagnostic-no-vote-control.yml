# TEMPORARY diagnostic scenario — not one of the 4 real built-in scenarios (underscore-prefixed
# so it's obviously not part of the product). Restarts all validators onto the newer binary but
# NEVER fires set-upgrade at all, to isolate whether the binary restart alone (not an explicit
# vote) is what's actually driving the protocol_version change observed in happy-path and
# mismatched-vote. See PLAN.md "Verify-scenarios attempt #2" for why this exists. Delete this
# file once the question is answered.
name: diagnostic-no-vote-control
description: Control test — restarts validators onto a newer binary but never votes, to isolate the real cause of the observed protocol version change.

topology:
  validators:
    - name: node1
      image: "28"
    - name: node2
      image: "28"
    - name: node3
      image: "28"
  quorumThresholdPercent: 67

timeline:
  - at: 0
    action: { type: wait, seconds: 90 }
  - at: 90
    action: { type: start-node, node: node1, image: "29" }
  - at: 90
    action: { type: start-node, node: node2, image: "29" }
  - at: 90
    action: { type: start-node, node: node3, image: "29" }
  - at: 90
    action: { type: wait, seconds: 60 }

observations:
  intervalSeconds: 10
