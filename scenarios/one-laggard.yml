# Two of three validators upgrade their binaries and vote; the third is left on the old
# version and never votes — a real operator who missed the upgrade window.
#
# Observed outcome (real runs, ../PLAN.md "Resolution: the fix is correct"): NOBODY adopts the
# upgrade. With 3 validators at a 67% threshold, THRESHOLD_PERCENT rounds up to all 3, so one
# non-voting validator blocks the vote network-wide. Every node stays synced and the ledger
# stays at genesis protocol 0. The expectation below (`finalProtocolVersion: 29`) is therefore
# deliberately NOT met, and the verdict is UPGRADE_NOT_ADOPTED. A topology where the voting
# majority could outvote a laggard (for example 5 validators) has not been run yet.
name: one-laggard
description: One validator never gets the upgrade vote; with 3 validators at 67% all 3 must agree, so the whole network stays at protocol 0.

topology:
  validators:
    - name: node1
      image: "28"
    - name: node2
      image: "28"
    - name: node3
      image: "28"
  quorumThresholdPercent: 67

timeline:
  - at: 0
    action: { type: wait, seconds: 90 }
  - at: 90
    action: { type: start-node, node: node1, image: "29" }
  - at: 90
    action: { type: start-node, node: node2, image: "29" }
  # node3 deliberately never restarted — it stays on the older binary throughout.
  - at: 90
    action: { type: wait, seconds: 90 }
  - at: 180
    action:
      type: set-upgrade
      nodes: [node1, node2]
      protocolVersion: 29
      upgradeDelaySeconds: 45
  # node3 deliberately never sent an upgrade vote either — a real lagging operator wouldn't.
  - at: 180
    action: { type: wait, seconds: 120 }

observations:
  intervalSeconds: 10

expectations:
  finalProtocolVersion: 29
  nodesShouldStaySynced: [node1, node2, node3]
